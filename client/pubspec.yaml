name: huabu_app
description: 未来画布跨平台创作客户端
publish_to: none
version: 0.1.5+6

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.0.0
  forui: 0.27.5
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  flutter_staggered_grid_view: ^0.7.0
  mime: ^2.0.0
  uuid: ^4.5.2
  crypto: ^3.0.7
  flutter_animate: ^4.5.2
  desktop_drop: ^0.8.4
  flutter_markdown_plus: ^1.0.12
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  sse_parser: ^0.1.0
  markdown: ^7.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  auto_updater: ^1.0.0
  pub_semver: ^2.2.0
  mobile_scanner: 7.4.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app-icon.png
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app-icon-macos.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
